<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee4">
  <title><span data-zh="音樂創作坊" data-en="Music Maker">音樂創作坊</span></title>
  <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav class="language-bar" aria-label="語言" data-aria-zh="語言" data-aria-en="Language">
    <div class="language-switch" role="group" aria-label="選擇語言" data-aria-zh="選擇語言" data-aria-en="Choose language">
      <button type="button" data-language="zh" lang="zh-Hant" aria-pressed="true">中文</button>
      <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
    </div>
  </nav>
  <div id="gate">
    <div class="gate-card">
      <p class="gate-title"><span data-zh="音樂創作坊" data-en="Music Maker">音樂創作坊</span></p>

      <p><span data-zh="按一下，打開聲音。" data-en="Tap once to turn the sound on.">按一下，打開聲音。</span></p>
      <button id="startBtn" type="button"><span data-zh="開始" data-en="Start">開始</span></button>
      <p id="gateMsg"></p>
    </div>
  </div>

  <div id="app" class="wrap" inert>
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle cx="32" cy="28" r="14" fill="#FFE08A"/><rect x="16" y="46" width="32" height="6" rx="3" fill="#fff"/></svg>
        </div>
        <div>
          <h1 id="pageTitle"><span data-zh="音樂創作坊" data-en="Music Maker">音樂創作坊</span></h1>
          <span class="sub"><span data-zh="創作你自己的音樂" data-en="Make your own music">創作你自己的音樂</span></span>
        </div>
      </div>
      <button id="previewBtn" class="btn primary" type="button" aria-pressed="false"><span data-zh="試聽" data-en="Preview">試聽</span></button>
    </header>

    <div class="steps" aria-label="步驟" data-aria-zh="步驟" data-aria-en="Steps">
      <div class="step"><i>1</i><span data-zh="選節奏" data-en="Choose">選節奏</span></div>
      <div class="step"><i>2</i><span data-zh="試聽" data-en="Play">試聽</span></div>
    </div>

    <p id="status" class="status" role="status">選速度、力度、樂器和風格，再按試聽。</p>

    <div class="layout single">
      <section class="panel" aria-labelledby="videoHeading" hidden>
        <h2 id="videoHeading"><span data-zh="廣告" data-en="Advert">廣告</span></h2>
        <div class="tv">
          <div class="screen">
            <video id="adVideo" poster="media/poster.jpg" src="media/ad.mp4" playsinline webkit-playsinline preload="auto" muted></video>
          </div>
          <p id="tvLabel" class="tv-label"><span data-zh="廣告" data-en="Ad">廣告</span></p>
        </div>
        <div class="player-row">
          <button id="videoToggle" class="btn" type="button" aria-pressed="false"><span data-zh="播放" data-en="Play">播放</span></button>
          <label class="sr" for="seek"><span data-zh="廣告位置" data-en="Ad position">廣告位置</span></label>
          <input id="seek" class="seek" type="range" min="0" max="1000" value="0" disabled>
          <span class="time"><span id="timeNow">0:00</span> / <span id="timeTotal">0:00</span></span>
        </div>
        <div class="file-row">
          <label class="file-btn"><span data-zh="載入影片" data-en="Load video">載入影片</span>
            <input id="videoFile" type="file" accept="video/*">
          </label>
          <button id="useDemo" class="btn" type="button"><span data-zh="陽光橙示範" data-en="Orange demo">陽光橙示範</span></button>
          <button id="useSample" class="btn" type="button" hidden><span data-zh="返回廣告" data-en="Back to ad">返回廣告</span></button>
        </div>
        <p class="hint"><span data-zh="影片只留在這部裝置。廣告原聲會關掉。" data-en="The video stays on this device. The ad sound is muted.">影片只留在這部裝置。廣告原聲會關掉。</span></p>
        <div class="length-row">
          <label for="length"><span data-zh="長度" data-en="Length">長度</span></label>
          <input id="length" type="range" min="10" max="30" step="1" value="15">
          <div class="length-readout"><span id="lengthValue">15</span><small><span data-zh="秒" data-en="sec">秒</span></small></div>
        </div>
        <div class="meter" aria-hidden="true"><span id="meter"></span></div>
        <div class="action-row">
          <button id="watchAd" class="btn" type="button" aria-pressed="false"><span data-zh="睇廣告" data-en="Watch ad">睇廣告</span></button>
          <button id="watchMusic" class="btn primary" type="button" aria-pressed="false"><span data-zh="用我的音樂睇" data-en="Watch with my music">用我的音樂睇</span></button>
        </div>
        <p id="scaleLine" class="scale-line"></p>
        <p id="chordLine" class="chord-line"></p>
      </section>

      <section id="cardBoard" class="panel card-col" aria-label="快速開始" data-aria-zh="快速開始" data-aria-en="Quick start">
        <div id="moodRow">
          <h2><span data-zh="心情" data-en="Mood">心情</span></h2>
          <div id="moodCards" class="cards cols-5"></div>
        </div>
        <h2><span data-zh="速度" data-en="Speed">速度</span></h2>
        <div id="speedCards" class="cards cols-3"></div>
        <h2><span data-zh="力度" data-en="Dynamics">力度</span></h2>
        <div id="dynamicsCards" class="cards cols-3"></div>
        <h2><span data-zh="樂器（低音 → 高音）" data-en="Instrument (low → high)">樂器（低音 → 高音）</span></h2>
        <div id="instrumentCards" class="cards cols-5"></div>
        <h2><span data-zh="風格" data-en="Style">風格</span></h2>
        <div id="styleCards" class="cards cols-4"></div>
        <p class="hint"><span data-zh="點圖卡會換上新節奏。" data-en="Picking a card loads a new pattern.">點圖卡會換上新節奏。</span></p>
      </section>
    </div>

    <section class="grid-section" aria-labelledby="gridHeading" hidden>
      <div class="grid-head">
        <div>
          <h2 id="gridHeading"><span data-zh="音樂格子" data-en="Grid">音樂格子</span></h2>
          <p id="summary" class="summary"></p>
        </div>
      </div>
      <p class="hint"><span data-zh="點一下格子就可以開關。這 16 格會重複，直到時間完。" data-en="Tap a square to switch it. These 16 steps repeat until the time ends.">點一下格子就可以開關。這 16 格會重複，直到時間完。</span></p>
      <div id="grid" class="seq-scroll"></div>
      <div class="export-row">
        <button id="exportWav" class="btn" type="button"><span data-zh="下載 WAV" data-en="Download WAV">下載 WAV</span></button>
        <a id="saveWav" class="btn primary" hidden download="ad-music.wav"><span data-zh="儲存 WAV" data-en="Save WAV">儲存 WAV</span></a>
        <button id="saveJson" class="btn" type="button"><span data-zh="儲存設定" data-en="Save settings">儲存設定</span></button>
        <label class="file-btn"><span data-zh="載入設定" data-en="Load settings">載入設定</span>
          <input id="loadJson" type="file" accept="application/json,.json">
        </label>
      </div>
      <p class="legal"><span data-zh="樂器使用真實錄音，鼓聲由以下程式合成：" data-en="Recorded instruments; drums synthesized with:">樂器使用真實錄音，鼓聲由以下程式合成：</span> <a href="vendor/tone/LICENSE.md">Tone.js (MIT)</a> · <a href="vendor/instrument-samples/CREDITS.md"><span data-zh="音源來源及授權" data-en="Sample credits">音源來源及授權</span></a> · <span data-zh="沒有帳戶，也不會儲存學生資料。" data-en="No accounts, and no student work is stored.">沒有帳戶，也不會儲存學生資料。</span></p>
    </section>
  </div>

  <noscript>
    <p>請開啟 JavaScript 才能使用這個工作坊。</p>
  </noscript>

  <script>window.TONE_SILENCE_LOGGING = true;</script>
  <script src="vendor/tone/Tone.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/instrument-samples.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
